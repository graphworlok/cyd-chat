[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv      ; TLS server needs more than the default 1.3 MB app slot
board_build.embed_txtfiles =
  certs/fullchain.pem
  certs/key.pem
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  ricmoo/QRCode@^0.0.1
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
  -DCHAT_HOST=\"chat.example.com\"   ; your hostname; must match certs/fullchain.pem
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1      ; most CYDs; if colours/image look wrong try -DILI9341_DRIVER
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_ON
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DSPI_FREQUENCY=40000000
